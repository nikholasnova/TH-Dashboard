name: Arduino Build

on:
  push:
    branches: [main]
    paths:
      - 'arduino/**'
      - '.github/workflows/arduino.yml'
  pull_request:
    paths:
      - 'arduino/**'
      - '.github/workflows/arduino.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Install board core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib install "DFRobot_DHT20"
          arduino-cli lib install "LiquidCrystal"

      - name: Create dummy secrets.h
        run: cp arduino/sensor_node/secrets.example.h arduino/sensor_node/secrets.h

      - name: Build Uno R4 WiFi sketch
        run: arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi arduino/sensor_node/sensor_node.ino
